<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Guitar CAGED + Chord Lookup</title>
<link rel="apple-touch-icon" sizes="512x512" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#1a1a1a;color:#eee;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow-x:hidden}
.app{display:flex;flex-direction:column;height:100vh;padding:6px}

/* Controls row */
.ctrl-row{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;margin-bottom:5px}
.ctrl{display:flex;flex-direction:column;gap:2px}
.clbl{font-size:10px;color:#888;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
select{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:5px;padding:4px 6px;font-size:13px;height:32px}

/* Shape toggles */
.tog-all{padding:5px 8px;cursor:pointer;font-size:11px;font-weight:600;border:1.5px solid #555;border-radius:5px;background:#2a2a2a;color:#aaa;white-space:nowrap;height:32px}
.tog-all:hover{border-color:#888;color:#eee}
.interval-dd-btn{padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600;border:1.5px solid #556;border-radius:5px;background:#2a2a3e;color:#aac;height:38px;white-space:nowrap}
.interval-dd-btn:hover{border-color:#88a}
.interval-dd-btn.active{border-color:#8af;color:#cdf;background:#2a3a5e}
.interval-menu{display:none;position:absolute;top:100%;right:0;margin-top:4px;background:#1e1e2a;border:1px solid #445;border-radius:8px;padding:6px;z-index:1000;box-shadow:0 6px 20px rgba(0,0,0,.5);min-width:150px;max-height:340px;overflow-y:auto}
.interval-menu.open{display:block}
.interval-menu label{display:flex;align-items:center;gap:7px;padding:5px 8px;font-size:12px;color:#ccc;cursor:pointer;border-radius:4px;white-space:nowrap}
.interval-menu label:hover{background:#2a2a3a}
.interval-menu input{width:15px;height:15px;accent-color:#7af}
.im-section{font-size:10px;font-weight:700;color:#778;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px 2px}
.im-clear{margin-top:4px;padding:6px 8px;font-size:11px;color:#e88;cursor:pointer;border-top:1px solid #334;text-align:center}
.im-clear:hover{color:#faa}
.tog-majmin{padding:5px 10px;cursor:pointer;font-size:12px;font-weight:700;border:2px solid #c8a020;border-radius:5px;background:#3a2e08;color:#f0c030;white-space:nowrap;height:32px;letter-spacing:.02em}
.tog-majmin:hover{filter:brightness(1.15)}

/* Chord row */
.chord-row{display:flex;gap:5px;align-items:flex-end;flex-wrap:wrap;margin-bottom:5px;padding:5px 0 5px;border-top:1px solid #333}
.chord-lbl{font-size:10px;color:#888;font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.chord-picker-btn{padding:5px 12px;cursor:pointer;font-size:14px;font-weight:700;border:1.5px solid #556;border-radius:5px;background:#2a2a3e;color:#f0c050;height:32px;min-width:110px;text-align:left}
.chord-picker-btn:hover{border-color:#88a}
.btn-clear{padding:5px 10px;cursor:pointer;font-size:12px;font-weight:600;border:1.5px solid #555;border-radius:5px;background:#2a2a2a;color:#aaa;align-self:flex-end;height:32px}
.btn-clear:hover{border-color:#c05050;color:#e07070}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0;margin:-1px}

/* Chord picker sheet */
.picker-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;align-items:flex-end;justify-content:center}
.picker-overlay.open{display:flex}
.picker-sheet{background:#1e1e2a;border:1px solid #445;border-top-left-radius:14px;border-top-right-radius:14px;width:100%;max-width:420px;padding-bottom:10px;box-shadow:0 -8px 30px rgba(0,0,0,.6)}
.picker-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #333}
.picker-title{font-size:13px;font-weight:700;color:#ccc;letter-spacing:.03em;text-transform:uppercase}
.picker-cancel{background:none;border:none;color:#e88;font-size:14px;cursor:pointer;padding:4px 6px}
.picker-done{background:none;border:none;color:#8af;font-weight:700;font-size:14px;cursor:pointer;padding:4px 6px}
.picker-wheels{position:relative;display:flex;padding:4px 8px 0}
.picker-highlight{position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);height:34px;background:rgba(255,255,255,.06);border-top:1px solid #445;border-bottom:1px solid #445;pointer-events:none}
.wheel{flex:1;height:170px;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;position:relative;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28%,#000 72%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 28%,#000 72%,transparent 100%)}
.wheel::-webkit-scrollbar{display:none}
.wheel-track{padding:68px 0}
.wheel-item{height:34px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:13px;color:#777;cursor:pointer;white-space:nowrap;padding:0 4px}
.wheel-item.selected{color:#f0c050;font-weight:700;font-size:14.5px}
.btn-screen{padding:5px 9px;cursor:pointer;font-size:15px;font-weight:600;border:1.5px solid #446;border-radius:5px;background:#1a1a2e;color:#88aaff;height:32px;line-height:1}
.btn-screen:hover{border-color:#88aaff;color:#bbddff}
.settings-menu{display:none;position:fixed;top:54px;right:6px;background:#1e1e2a;border:1px solid #445;border-radius:8px;padding:10px;z-index:1000;box-shadow:0 6px 20px rgba(0,0,0,.5);min-width:130px}
.settings-menu.open{display:flex;flex-direction:column;gap:10px}
.settings-menu-item{display:flex;flex-direction:column;gap:2px}

/* Canvas */
.fb-wrap{overflow:auto;position:relative}
canvas{display:block;width:100%;height:auto}

/* Legend */
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:3px 0;align-items:center}
.li{font-size:10px;color:#888;display:flex;align-items:center;gap:3px}
.li svg{flex-shrink:0}
</style>
</head>
<body>
<div class="app">
    <button class="btn-screen" id="menuBtn" onclick="toggleSettingsMenu()" title="More options" style="position:fixed;top:22px;right:40px;z-index:999;padding:3px 7px;font-size:13px;height:26px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
  <line x1="4" y1="7" x2="20" y2="7"/>

</svg></button>
    <div id="settingsMenu" class="settings-menu">
      <div class="settings-menu-item">
        <button class="tog-all" id="togAll" onclick="toggleAll()" style="width:100%">All Off</button>
      </div>
    </div>
    <button class="btn-screen" onclick="openScreenSettings()" title="Open Display Settings" style="position:fixed;top:22px;right:6px;z-index:999;padding:3px 7px;font-size:13px;height:26px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
  <circle cx="12" cy="12" r="4"/>
  <line x1="12" y1="2" x2="12" y2="5"/>
  <line x1="12" y1="19" x2="12" y2="22"/>
  <line x1="2" y1="12" x2="5" y2="12"/>
  <line x1="19" y1="12" x2="22" y2="12"/>
  <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/>
  <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
  <line x1="19.78" y1="4.22" x2="17.66" y2="6.34"/>
  <line x1="6.34" y1="17.66" x2="4.22" y2="19.78"/>
</svg></button>

  <!-- CAGED Key + Capo + Toggles -->
  <div class="ctrl-row">
    <div class="ctrl">
      <span class="clbl">Key</span>
      <select id="ks">
        <option value="C">C · 0 · Am</option>
        <option value="G">G · 1♯ · Em</option>
        <option value="D">D · 2♯ · Bm</option>
        <option value="A">A · 3♯ · F♯m</option>
        <option value="E">E · 4♯ · C♯m</option>
        <option value="B">B · 5♯ · G♯m</option>
        <option value="F#">F♯ · 6♯ · D♯m</option>
        <option value="F">F · 1♭ · Dm</option>
        <option value="Bb">B♭ · 2♭ · Gm</option>
        <option value="Eb">E♭ · 3♭ · Cm</option>
        <option value="Ab">A♭ · 4♭ · Fm</option>
        <option value="Db">D♭ · 5♭ · B♭m</option>
      </select>
    </div>
    <div class="ctrl">
      <span class="clbl">Capo</span>
      <select id="cap">
        <option value="0">None</option>
        <option value="1">1</option><option value="2">2</option>
        <option value="3">3</option><option value="4">4</option>
        <option value="5">5</option><option value="6">6</option>
        <option value="7">7</option><option value="8">8</option>
        <option value="9">9</option><option value="10">10</option>
        <option value="11">11</option><option value="12">12</option>
      </select>
    </div>
    <div class="ctrl">
      <span class="clbl">Frets</span>
      <select id="numFrets" onchange="draw()">
        <option value="12">12</option>
        <option value="13">13</option>
        <option value="15" selected>15</option>
        <option value="17">17</option>
      </select>
    </div>
    <div style="display:flex;gap:4px;align-items:flex-end">
      <button class="tog-majmin" id="togMajMin" onclick="toggleMajMin()">Major</button>
      <button class="tog-all" id="togScale" onclick="toggleScale()" style="border-color:#666;color:#ccc">Scale</button>
      <button class="tog-all" id="togNumbers" onclick="toggleNumbers()" style="border-color:#666;color:#ccc">Numbers</button>
    </div>

  </div>

  <!-- Chord lookup -->
  <div class="chord-row">
    <div class="ctrl">
      <span class="chord-lbl">Chord</span>
      <button id="chordNameDisplay" class="chord-picker-btn" onclick="openChordPicker()">Select chord ▾</button>
    </div>
    <button class="btn-clear" onclick="clearChord()">✕ Clear</button>

    <!-- Hidden model selects: the app's chord logic reads/writes these; the
         chord picker sheet below is just an alternate UI that drives them. -->
    <select id="cr" class="visually-hidden">
      <option value="C">C</option>
      <option value="C#">C♯ / D♭</option>
      <option value="D">D</option>
      <option value="D#">D♯ / E♭</option>
      <option value="E">E</option>
      <option value="F">F</option>
      <option value="F#">F♯ / G♭</option>
      <option value="G">G</option>
      <option value="G#">G♯ / A♭</option>
      <option value="A">A</option>
      <option value="A#">A♯ / B♭</option>
      <option value="B">B</option>
    </select>
    <select id="ct" class="visually-hidden">
      <option value="maj">Major</option>
      <option value="m">Minor</option>
      <option value="7">7</option>
      <option value="m7">m7</option>
      <option value="maj7">maj7</option>
      <option value="6">6</option>
      <option value="m6">m6</option>
      <option value="9">9</option>
      <option value="sus4">sus4</option>
      <option value="sus2">sus2</option>
      <option value="add9">add9</option>
      <option value="7sus4">7sus4</option>
      <option value="5">5 (power)</option>
      <option value="maj9">maj9</option>
      <option value="m9">m9</option>
      <option value="dim">dim</option>
      <option value="+">aug (+)</option>
      <optgroup label="── Slash chords ──">
      <option value="/A">/ A bass</option>
      <option value="/Bb">/ B♭ bass</option>
      <option value="/B">/ B bass</option>
      <option value="/C">/ C bass</option>
      <option value="/C#">/ C♯ bass</option>
      <option value="/D">/ D bass</option>
      <option value="/D#">/ D♯ bass</option>
      <option value="/Eb">/ E♭ bass</option>
      <option value="/E">/ E bass</option>
      <option value="/F">/ F bass</option>
      <option value="/F#">/ F♯ bass</option>
      <option value="/G">/ G bass</option>
      <option value="/Ab">/ A♭ bass</option>
      <option value="/G#">/ G♯ bass</option>
      </optgroup>
    </select>
    <select id="voicing" class="visually-hidden">
      <option value="0">1st</option>
    </select>

    <div class="ctrl" style="position:relative">
      <span class="chord-lbl">Intervals</span>
      <button id="intervalBtn" class="interval-dd-btn" onclick="toggleIntervalMenu()">Layers ▾</button>
      <div id="intervalMenu" class="interval-menu">
        <div class="im-section">Triads</div>
        <label><input type="checkbox" data-int="triads123" onchange="onIntervalCheck(this)"> Triads 1-3</label>
        <label><input type="checkbox" data-int="triads234" onchange="onIntervalCheck(this)"> Triads 2-4</label>
        <label><input type="checkbox" data-int="triads345" onchange="onIntervalCheck(this)"> Triads 3-5</label>
        <label><input type="checkbox" data-int="triads456" onchange="onIntervalCheck(this)"> Triads 4-6</label>
        <div class="im-section">Thirds</div>
        <label><input type="checkbox" data-int="thirds_5_4" onchange="onIntervalCheck(this)"> 3rd e-B</label>
        <label><input type="checkbox" data-int="thirds_4_3" onchange="onIntervalCheck(this)"> 3rd B-G</label>
        <label><input type="checkbox" data-int="thirds_3_2" onchange="onIntervalCheck(this)"> 3rd G-D</label>
        <label><input type="checkbox" data-int="thirds_2_1" onchange="onIntervalCheck(this)"> 3rd D-A</label>
        <label><input type="checkbox" data-int="thirds_1_0" onchange="onIntervalCheck(this)"> 3rd A-E</label>

        <label><input type="checkbox" data-int="sixths_5_3" onchange="onIntervalCheck(this)"> 6th e-G</label>
        <label><input type="checkbox" data-int="sixths_4_2" onchange="onIntervalCheck(this)"> 6th B-D</label>
        <label><input type="checkbox" data-int="sixths_3_1" onchange="onIntervalCheck(this)"> 6th G-A</label>
        <label><input type="checkbox" data-int="sixths_2_0" onchange="onIntervalCheck(this)"> 6th D-E</label>
        <div class="im-clear" onclick="clearAllIntervals()">Clear all</div>
      </div>
    </div>
  </div>

  <!-- Chord picker: one button opens this instead of three separate dropdowns -->
  <div id="chordPickerOverlay" class="picker-overlay" onclick="if(event.target===this) closeChordPicker()">
    <div class="picker-sheet">
      <div class="picker-header">
        <button class="picker-cancel" onclick="closeChordPicker()">Cancel</button>
        <span class="picker-title">Chord</span>
        <button class="picker-done" onclick="applyChordPicker()">Done</button>
      </div>
      <div class="picker-wheels">
        <div class="picker-highlight"></div>
        <div class="wheel" id="wheelRoot"><div class="wheel-track" id="wheelRootTrack"></div></div>
        <div class="wheel" id="wheelType"><div class="wheel-track" id="wheelTypeTrack"></div></div>
        <div class="wheel" id="wheelVoicing"><div class="wheel-track" id="wheelVoicingTrack"></div></div>
      </div>
    </div>
  </div>

  <!-- Fretboard canvas -->
  <div class="fb-wrap">
    <canvas id="cv"></canvas>
  </div>

  <!-- Capo chord chart (shown only when capo>0) -->

  <!-- Legend -->
  <div class="legend">
    <div class="li"><svg width="12" height="12"><circle cx="6" cy="6" r="5.5" fill="#a01818"/></svg>Root</div>
    <div class="li"><svg width="12" height="12"><circle cx="6" cy="6" r="5.5" fill="#e67e22"/></svg>3rd</div>
    <div class="li"><svg width="12" height="12"><circle cx="6" cy="6" r="5.5" fill="#c9a227"/></svg>5th</div>

<script>

// ── Theory ──────────────────────────────────────────────────────────────────
const CHR=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const EN={Gb:'F#',Db:'C#',Ab:'G#',Eb:'D#',Bb:'A#','F#':'F#'};
function ni(n){return CHR.indexOf(EN[n]||n)}
function nn(idx,flat){return flat?FLT[(idx+1200)%12]:CHR[(idx+1200)%12]}
const FLAT_KEYS=new Set(['F','Bb','Eb','Ab','Db','Gb']);
const SOPEN=[4,9,2,7,11,4]; // str0=lowE..str5=hiE
const ROWLBL=['E','B','G','D','A','E']; // row0=hiE..row5=lowE

// ── CAGED shapes (C major pentatonic, [stringIdx(0=lowE), fret]) ────────────
const C_SHAPES={
  C:{notes:[[0,0],[0,3],[1,0],[1,3],[2,0],[2,2],[3,0],[3,2],[4,1],[4,3],[5,0],[5,3]]},
  A:{notes:[[0,3],[0,5],[1,3],[1,5],[2,2],[2,5],[3,2],[3,5],[4,3],[4,5],[5,3],[5,5]]},
  G:{notes:[[0,5],[0,8],[1,5],[1,7],[2,5],[2,7],[3,5],[3,7],[4,5],[4,8],[5,5],[5,8]]},
  E:{notes:[[0,8],[0,10],[1,7],[1,10],[2,7],[2,10],[3,7],[3,9],[4,8],[4,10],[5,8],[5,10]]},
  D:{notes:[[0,10],[0,12],[1,10],[1,12],[2,10],[2,12],[3,9],[3,12],[4,10],[4,13],[5,10],[5,12]]}
};
const SHAPE_ORDER=['C','A','G','E','D'];
// In minor, the CAGED shape LABELS shift: the pattern stored as the major
// 'G' shape is the minor 'E' shape, etc. (verified: minor E-shape root sits
// on the minor root on the low E string).
function shapeLabel(sh, isMaj){
  if(isMaj) return sh;
  const i = SHAPE_ORDER.indexOf(sh);
  return SHAPE_ORDER[(i + 1) % 5];
}
const SCOLORS={C:'#f0b0c8',A:'#a8d898',G:'#90b4e8',E:'#f0c070',D:'#c0a0dc'};
const SDARK ={C:'#c04070',A:'#2a8030',G:'#2050b0',E:'#c07020',D:'#7040b0'};
const COL_ROOT='#a01818', COL_3RD='#e67e22', COL_5TH='#c9a227';
let vis={C:true,A:true,G:true,E:true,D:true};

// ── Chord library ───────────────────────────────────────────────────────────
// Format: [lowE, A, D, G, B, hiE]  null=muted, 0=open, n=fret
// Built from the Common Guitar Chords chart
const CHORD_VOICINGS = {

  // ── Ab / G# ──
  'Abmaj': [{l:'Barre 4',f:[4,null,6,5,4,4]},{l:'Alt',f:[null,null,6,5,4,4]}],
  'Abm':   [{l:'Barre 4',f:[4,null,6,4,4,4]},{l:'Alt',f:[null,null,6,4,4,4]}],
  'Ab6':   [{l:'Open',f:[null,null,1,1,1,1]},{l:'Alt',f:[4,null,3,4,4,4]}],
  'Ab7':   [{l:'Barre 4',f:[4,null,4,5,4,4]},{l:'Alt',f:[null,null,1,1,0,1]}],
  'Ab9':   [{l:'Open',f:[null,3,1,1,1,2]}],
  'Abm6':  [{l:'Open',f:[null,null,1,1,0,1]}],
  'Abm7':  [{l:'Barre 4',f:[4,null,4,4,4,4]},{l:'Alt',f:[null,null,1,1,0,1]}],
  'Abmaj7':[{l:'Open',f:[null,null,1,1,1,0]},{l:'Alt',f:[4,null,5,5,4,4]}],
  'Abdim': [{l:'Open',f:[null,null,0,1,0,1]}],
  'Ab+':   [{l:'Open',f:[null,null,2,1,1,0]}],
  'Absus4':[{l:'Barre 4',f:[4,4,6,6,4,4]}],
  'Absus2':[{l:'Barre 4',f:[4,4,6,6,4,4]}],
  'Abadd9':[{l:'Open',f:[null,null,1,3,1,1]}],
  'Ab7sus4':[{l:'Barre 4',f:[4,4,4,5,4,4]}],
  'Ab5':   [{l:'Barre 4',f:[4,null,6,6,null,null]}],
  'Abmaj9':[{l:'Open',f:[null,null,1,3,3,3]}],
  'Abm9':  [{l:'Open',f:[null,null,1,1,0,1]}],

  // ── A ──
  'Amaj':  [{l:'Open',f:[null,0,2,2,2,0]},{l:'Barre 5',f:[5,7,7,6,5,5]},{l:'Alt',f:[null,null,2,2,2,2]}],
  'Am':    [{l:'Open',f:[null,0,2,2,1,0]},{l:'Barre 5',f:[5,7,7,5,5,5]}],
  'A6':    [{l:'Open',f:[null,0,2,2,2,2]},{l:'Alt',f:[null,0,4,4,2,2]}],
  'A7':    [{l:'Open',f:[null,0,2,0,2,0]},{l:'Alt',f:[null,0,2,2,2,3]}],

// ── Compatibility: CHORDS[key] returns first voicing frets ──
const CHORDS = new Proxy({}, {
  get(target, key) {
    const v = CHORD_VOICINGS[key];
    return v ? v[0].f : undefined;
  },
  has(target, key) {
    return key in CHORD_VOICINGS;
  }
});

// ── Get all voicings for a chord key ──
function getVoicings(key) {
  return CHORD_VOICINGS[key] || null;
}

// Map accidental+root combos to canonical chord key
function chordKey(root, acc, type){
  // root is now the full note name (C, C#, D, D#, E, F, F#, G, G#, A, A#, B)
  // acc is unused (kept for compat) but root already includes accidental
  let note = root; // e.g. 'A#', 'C#', 'G#' etc
  // Normalize sharps to flats where our library uses flats
  const norm = {'A#':'Bb','C#':'Db','D#':'Eb','G#':'Ab'};
  if(norm[note]) note=norm[note];
  // F# stays as F#
  if(type.startsWith('/')){
    const slashMaj = note + 'maj' + type;
    const slashMin = note + 'm' + type;
    if(CHORD_VOICINGS[slashMaj]) return slashMaj;
    if(CHORD_VOICINGS[slashMin]) return slashMin;
    return slashMaj;
  }
  const suffix = type==='maj'?'maj':type;
  const key1 = note + suffix;
  if(CHORD_VOICINGS[key1]) return key1;
  if(type==='sus4'){
    const key2 = note + 'sus';
    if(CHORD_VOICINGS[key2]) return key2;
  }
  return key1;
}

function getChord(){
  if(chordCleared) return {key:'', frets:null};
  const root=document.getElementById('cr').value;
  const type=document.getElementById('ct').value;
  const soundKey=chordKey(root,'',type);   // what it should SOUND like

  // With a capo you finger the shape (capo acts as the new nut), so the shape
  // chord is (soundingRoot - capo). Look up that voicing; it's drawn at +capo.
  const cap = capoPos||0;
  const CHR=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const shapeRootIdx = ((ni(root) - cap) % 12 + 12) % 12;
  const shapeRoot = CHR[shapeRootIdx];
  const shapeKey = chordKey(shapeRoot,'',type);

  const voicings = CHORD_VOICINGS[shapeKey] || CHORD_VOICINGS[soundKey];
  if(!voicings) return {key:soundKey, frets:null};
  const idx=Math.min(+(document.getElementById('voicing').value||0), voicings.length-1);
  return {key: soundKey, shapeKey, frets: voicings[idx].f};
}

// ── Instances ──
function getInstances(R,capo,SHOW){
  const out={};
  SHAPE_ORDER.forEach(sh=>{
    const insts=[];
    for(let oct=-1;oct<=2;oct++){
      const shift=R+oct*12;
      if(C_SHAPES[sh].notes.some(([,f])=>{const v=f+shift;return v>=0&&v<=SHOW;}))
        insts.push(shift);
    }
    out[sh]=insts;
  });
  return out;
}

// ── Draw ──────────────────────────────────────────────────────────────────
function buildCapoChart(R, isMajor, capo, useFlats){
  const chart=document.getElementById('capoChart');
  if(!chart) return;
  const CHR_SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const CHR_FLAT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
  const nm=(idx)=>(useFlats?CHR_FLAT:CHR_SHARP)[((idx%12)+12)%12];
  const MAJOR_DEG=[[0,''],[2,'m'],[4,'m'],[5,''],[7,''],[9,'m'],[11,'°']];
  const MINOR_DEG=[[0,'m'],[2,'°'],[3,''],[5,'m'],[7,'m'],[8,''],[10,'']];
  const ROMAN_MAJ=['I','ii','iii','IV','V','vi','vii°'];
  const ROMAN_MIN=['i','ii°','III','iv','v','VI','VII'];
  const deg=isMajor?MAJOR_DEG:MINOR_DEG;
  const roman=isMajor?ROMAN_MAJ:ROMAN_MIN;
  const keyName=nm(R)+(isMajor?'':'m');

  if(capo>0){
    // Capo active: show shape chord -> sounding chord
    const parts=deg.map(([iv,q],i)=>{
      const shapeCh=nm(R-capo+iv)+q;
      const soundCh=nm(R+iv)+q;
      return `<span style="color:#8ab">${shapeCh}</span>`+
             `<span style="color:#556">→</span>`+
             `<span style="color:#d0a030">${soundCh}</span>`;
    });
    const shapeKeyName=nm(R-capo)+(isMajor?'':'m');
    chart.innerHTML=`<b style="color:#aaa">Capo ${capo}:</b> finger <b style="color:#8ab">${shapeKeyName}</b> shapes → sounds <b style="color:#d0a030">${keyName}</b> &nbsp;&nbsp; ` + parts.join(' &nbsp; ');
  } else {
    // No capo: show the diatonic chords of the key
    const parts=deg.map(([iv,q],i)=>{
      const ch=nm(R+iv)+q;
      return `<span style="color:#d0a030">${ch}</span>`;
    });
    chart.innerHTML=`<b style="color:#aaa">Key of ${keyName}:</b> &nbsp; ` + parts.join(' &nbsp; ');
  }
  chart.style.display='block';
}

function draw(){
  const key=document.getElementById('ks').value;
  const capo=capoPos;
  const R=ni(EN[key]||key);
  const useFlats=FLAT_KEYS.has(key);
  // For minor mode, the "effective root" for coloring shifts 3 semitones down
  // Minor pentatonic: root(0), b3(3), 4th(5), 5th(7), b7(10)
  const MINOR_PENTA=[0,3,5,7,10];
  const MAJOR_PENTA=[0,2,4,7,9];
  const effectiveR = isMajor ? R : (R-3+12)%12; // minor = RELATIVE minor (per dropdown label)
  const pentaIntervals = isMajor ? MAJOR_PENTA : MINOR_PENTA;
  // Chord tone intervals (for coloring root/3rd/5th)
  const INT_ROOT = 0;
  const INT_3RD  = isMajor ? 4 : 3;  // maj3 or min3
  const INT_5TH  = 7;                  // perfect 5th same in both

  const cv=document.getElementById('cv');
  const wrap=cv.parentElement;
  const W=wrap.clientWidth||window.innerWidth;
  const SHOW=+document.getElementById('numFrets').value;
  const lW=24,rP=4;
  const shLblH=22,fnH=28;
  const gW=W-lW-rP;
  const fw=gW/SHOW;
  // Lock aspect ratio: string spacing (rowH) proportional to fret width (fw)
  // so the fretboard keeps consistent proportions regardless of orientation.
  // A real guitar: string spacing ≈ 0.42 inch, low-fret spacing ≈ 1.3 inch near nut,
  // but for a schematic we use a fixed pleasant ratio.
  const STR_TO_FRET = 0.62; // rowH = fw * STR_TO_FRET
  const rowH = fw * STR_TO_FRET;
  const fbH = rowH * 6;
  const topPad=shLblH+fnH;
  const totalH=fbH+shLblH+fnH+2;
  const H=totalH;
  const DR=Math.min(Math.floor(fw*.38),Math.floor(rowH*.38),13);
  // Store geometry for pointer/drag handlers
  window._fbGeo = {lW, fw, topPad, fbH, SHOW, W};

  cv.width=W; cv.height=totalH;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,W,totalH);

  const lineCol='rgba(255,255,255,.12)';
  const mutedCol='#666';
  const textCol='#eee';

  // Shape positions: major anchors to R, minor anchors 3 semitones higher
  // (minor penta of R = major penta of R+3)
  const shapeShift = R; // shapes identical: major key & its relative minor share notes
  const instances=getInstances(shapeShift,capo,SHOW);

  function dotX(vf){ return vf===0 ? lW-DR-1 : lW+(vf-0.5)*fw; }
  function dotY(row){ return topPad+row*rowH+rowH/2; }
  function strRow(si){ return 5-si; }

  // ── Polygons ──
  function shapePolygon(sh,shift){
    // Build the polygon from ALL notes of the shape (even off-board ones), then
    // clamp x to the visible board. This makes shapes end cleanly at the nut /
    // last fret instead of collapsing into odd wedges.
    const loBound = capo>0 ? capo : 0;   // capo acts as the new nut
    const xMin = dotX(Math.max(loBound,0));
    const xMax = dotX(SHOW);
    const pts=[];
    C_SHAPES[sh].notes.forEach(([si,origF])=>{
      const vf=origF+shift;
      // keep the note but clamp its x into the visible range
      const cx=Math.min(Math.max(dotX(vf), xMin), xMax);
      pts.push({si,vf,x:cx,y:dotY(strRow(si))});
    });
    if(!pts.length) return null;
    // If the entire shape lies outside the visible board, skip it
    const anyVisible = C_SHAPES[sh].notes.some(([,origF])=>{
      const vf=origF+shift;
      return vf>=loBound && vf<=SHOW;
    });
    if(!anyVisible) return null;
    const byRow=new Map();
    pts.forEach(p=>{const r=strRow(p.si);if(!byRow.has(r))byRow.set(r,[]);byRow.get(r).push(p);});
    const rows=[...byRow.keys()].sort((a,b)=>a-b);
    const left =rows.map(r=>{ const s=byRow.get(r).sort((a,b)=>a.x-b.x); return {x:s[0].x,y:s[0].y}; });
    const right=[...rows].reverse().map(r=>{ const s=byRow.get(r).sort((a,b)=>b.x-a.x); return {x:s[0].x,y:s[0].y}; });
    return [...left,...right];
  }

  SHAPE_ORDER.forEach(sh=>{
    if(!vis[sh]) return;
    instances[sh].forEach(shift=>{
      const poly=shapePolygon(sh,shift);
      if(!poly||poly.length<3) return;
      ctx.beginPath();
      ctx.moveTo(poly[0].x,poly[0].y);
      poly.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));
      ctx.closePath();
      ctx.fillStyle=SCOLORS[sh]+'99';
      ctx.fill();
    });
  });

  // ── Shape labels ──
  SHAPE_ORDER.forEach(sh=>{
    if(!vis[sh]) return;
    instances[sh].forEach(shift=>{
      const vfs=C_SHAPES[sh].notes.map(([,f])=>f+shift).filter(v=>v>=0&&v<=SHOW);
      if(!vfs.length) return;
      const cx=(dotX(Math.min(...vfs))+dotX(Math.max(...vfs)))/2;
      ctx.fillStyle=SDARK[sh];
      ctx.font=`bold ${Math.max(10,Math.min(13,Math.floor(fw*.5)))}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(shapeLabel(sh,isMajor),cx,shLblH/2-1);
      ctx.font=`${Math.max(7,Math.min(9,Math.floor(fw*.35)))}px sans-serif`;
      ctx.fillStyle=SDARK[sh]+'99';
      ctx.fillText('shape',cx,shLblH/2+8);
    });
  });

  // ── Fret lines ──
  for(let f=0;f<=SHOW;f++){
    const x=lW+f*fw;
    ctx.strokeStyle=f===0?textCol:lineCol;
    ctx.lineWidth=f===0?3:.7;
    ctx.beginPath();ctx.moveTo(x,topPad);ctx.lineTo(x,topPad+fbH);ctx.stroke();
  }

  // ── Fret position markers (dots between strings) ──
  const SINGLE_DOTS=[3,5,7,9];
  const DOUBLE_DOTS=[12];
  const markerR=Math.max(Math.floor(fw*.12),3);
  const midY=topPad+fbH/2; // vertical center of fretboard

  // Convert visual fret to x center (between two fret lines = center of fret space)
  function markerX(vf){ return lW+(vf-0.5)*fw; }

  SINGLE_DOTS.forEach(vf=>{
    if(vf<1||vf>SHOW) return;
    const cx=markerX(vf);
    ctx.beginPath(); ctx.arc(cx, midY, markerR, 0, Math.PI*2);
    ctx.fillStyle='rgba(180,160,120,0.55)';
    ctx.fill();
  });

  DOUBLE_DOTS.forEach(vf=>{
    if(vf<1||vf>SHOW) return;
    const cx=markerX(vf);
    const spread=rowH*1.5;
    [midY-spread/2, midY+spread/2].forEach(cy=>{
      ctx.beginPath(); ctx.arc(cx, cy, markerR, 0, Math.PI*2);
      ctx.fillStyle='rgba(180,160,120,0.55)';
      ctx.fill();
    });
  });

  // ── Capo bar ──
  if(capo>0){
    const barX = lW + (capo-0.5)*fw;  // center of capo fret space
    const grayRight = lW + (capo-1)*fw;  // left edge of capo fret space
    // Gray out region left of capo (unplayable)
    ctx.fillStyle='rgba(20,20,25,0.55)';
    ctx.fillRect(0, topPad, Math.max(0,grayRight), fbH);
    ctx.fillStyle='#d0a030';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(barX-6, topPad-2, 12, fbH+4, 5) : ctx.rect(barX-6, topPad-2, 12, fbH+4);
    ctx.fill();
    ctx.strokeStyle='#8a6820';
    ctx.lineWidth=1.5;
    ctx.stroke();
    // Grip dots on the capo bar to signal draggability
    ctx.fillStyle='rgba(60,40,10,0.6)';
    for(let gy=1;gy<=3;gy++){
      const yy=topPad+fbH*gy/4;
      ctx.beginPath(); ctx.arc(barX, yy, 1.6, 0, Math.PI*2); ctx.fill();
    }
    // "CAPO" label
    ctx.fillStyle='#d0a030';
    ctx.font='bold 10px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('◀ CAPO ▶', barX, topPad+fbH+12);
  }

  // ── Nut drag hint (when no capo) ──
  if(capo===0){
    ctx.fillStyle='rgba(200,160,60,0.5)';
    for(let gy=1;gy<=3;gy++){
      const yy=topPad+fbH*gy/4;
      ctx.beginPath(); ctx.arc(lW-2, yy, 1.6, 0, Math.PI*2); ctx.fill();
    }
  }

  // ── Fret numbers (centered in each fret gap) ──
  ctx.fillStyle='#999';
  ctx.font='bold 18px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let f=1;f<=SHOW;f++){
    const x = lW + (f - 0.5) * fw;
    ctx.fillText(f, x, topPad - fnH/2);
  }

  // ── String lines & labels ──
  for(let row=0;row<6;row++){
    const y=dotY(row);
    ctx.strokeStyle=lineCol; ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(lW,y);ctx.lineTo(W-rP,y);ctx.stroke();
    ctx.fillStyle='#1a1a1a';
    ctx.fillRect(0,y-9,lW-1,18);
    ctx.fillStyle=textCol;
    ctx.font='bold 9px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(ROWLBL[row],(lW-1)/2,y);
  }

  // ── CAGED notes ──
  const noteMap=new Map();
  SHAPE_ORDER.forEach(sh=>{
    if(!vis[sh]) return;
    instances[sh].forEach(shift=>{
      C_SHAPES[sh].notes.forEach(([si,origF])=>{
        const vf=origF+shift;
        if(vf<0||vf>SHOW) return;
        const k=`${si},${vf}`;
        if(!noteMap.has(k)) noteMap.set(k,{si,vf,shapes:[]});
        const e=noteMap.get(k);
        if(!e.shapes.includes(sh)) e.shapes.push(sh);
      });
    });
  });

  noteMap.forEach(({si,vf,shapes})=>{
    const note=(SOPEN[si]+vf+1200)%12;
    const interval=(note-effectiveR+1200)%12;
    const isRoot=interval===INT_ROOT, is3rd=interval===INT_3RD, is5th=interval===INT_5TH;
    const row=strRow(si);
    const cx=dotX(vf), cy=dotY(row);
    const sh=shapes[0];
    ctx.beginPath(); ctx.arc(cx,cy,DR,0,Math.PI*2);
    if(isRoot){ ctx.fillStyle=COL_ROOT; }
    else if(is3rd){ ctx.fillStyle=COL_3RD; }
    else if(is5th){ ctx.fillStyle=COL_5TH; }
    else { ctx.fillStyle='#1a1a1a'; }
    ctx.fill();
    if(!isRoot&&!is3rd&&!is5th){
      ctx.strokeStyle=SDARK[sh]; ctx.lineWidth=1.5; ctx.stroke();
    } else {
      ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1; ctx.stroke();
    }
    const nm=showNumbers?degreeLabel(interval):nn(note,useFlats);
    ctx.fillStyle=is5th?'#3a2f00':((isRoot||is3rd)?'white':SDARK[sh]);
    ctx.font=`bold ${nm.length>1?Math.max(9,DR-1):Math.max(11,DR+2)}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(nm,cx,cy+.5);
  });

  // ── Scale note overlay ──
  if(showScale){
    const MAJOR_SCALE = isMajor
      ? [0,2,4,5,7,9,11]       // major scale
      : [0,2,3,5,7,8,10];      // natural minor scale
    const scaleNoteMap=new Map();
    // For each shape instance that's visible, for each string, find major scale notes
    // in the fret range of that shape instance that are NOT already in noteMap
    SHAPE_ORDER.forEach(sh=>{
      if(!vis[sh]) return;
      instances[sh].forEach(shift=>{
        const def=C_SHAPES[sh];
        // Get fret range for this instance
        const instVfrets=def.notes.map(([,f])=>f+shift).filter(v=>v>=0&&v<=SHOW);
        if(!instVfrets.length) return;
        const minVf=Math.min(...instVfrets);
        const maxVf=Math.max(...instVfrets);
        for(let si=0;si<6;si++){
          for(let vf=minVf;vf<=maxVf;vf++){
            const k=`${si},${vf}`;
            if(noteMap.has(k)) continue; // already drawn as CAGED note
            if(scaleNoteMap.has(k)) continue; // already queued
            const absFret=vf;
            const note=(SOPEN[si]+absFret+1200)%12;
            const interval=(note-effectiveR+1200)%12;
            if(!MAJOR_SCALE.includes(interval)) continue;
            scaleNoteMap.set(k,{si,vf,interval});
          }
        }
      });
    });
    const SDR=Math.max(Math.floor(DR*1.1),8); // twice as large
    scaleNoteMap.forEach(({si,vf,interval})=>{
      const row=strRow(si);
      const cx=dotX(vf), cy=dotY(row);
      ctx.beginPath(); ctx.arc(cx,cy,SDR,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,0.75)';
      ctx.fill();
      ctx.strokeStyle='rgba(180,180,180,0.5)';
      ctx.lineWidth=1;
      ctx.stroke();
      if(showNumbers){
        const lbl=degreeLabel(interval);
        ctx.fillStyle='#ddd';
        ctx.font=`bold ${lbl.length>1?Math.max(9,SDR-2):Math.max(11,SDR+1)}px sans-serif`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(lbl,cx,cy+.5);
      }
    });
  }

  // ── Chord overlay ──
  const chord=getChord();
  updateChordDisplay(chord.key, chord.frets);
  if(chord.frets){
    const frets=chord.frets; // [lowE..hiE], null=muted, 0=open
    // Find min non-null non-zero fret to determine position
    const played=frets.map((f,i)=>({f,si:i})).filter(x=>x.f!==null&&x.f>0);
    if(played.length>0){
      const minF=Math.min(...played.map(x=>x.f));
      const maxF=Math.max(...played.map(x=>x.f));
      // Determine if open chord (min fret <=3) or barre position
      // Visual fret = chord fret - capo (chord positions are absolute)
      const CDR=Math.max(DR-2,5); // chord dot slightly smaller
      frets.forEach((f,si)=>{
        const row=strRow(si);
        const cy=dotY(row);
        if(f===null){
          // muted: X just left of the nut (or capo, which acts as the new nut)
          const cx = capo>0 ? lW+(capo-0.5)*fw - CDR - 8 : lW-CDR-2;
          ctx.fillStyle='rgba(180,180,180,.8)';
          ctx.font=`bold ${CDR+2}px sans-serif`;
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('×',cx,cy);
          return;
        }
        const vf=f+capo; // visual fret
        if(vf<0||vf>SHOW) return;
        const cx=dotX(vf);
        // Draw white filled dot (slightly smaller)
        ctx.beginPath(); ctx.arc(cx,cy,CDR,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,.92)';
        ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,.4)';
        ctx.lineWidth=1; ctx.stroke();
        // Note name (or scale degree) inside
        const note=(SOPEN[si]+vf+1200)%12; // sounding pitch (includes capo)
        const lbl=showNumbers?degreeLabel((note-effectiveR+1200)%12):nn(note,useFlats);
        ctx.fillStyle='#222';
        ctx.font=`bold ${lbl.length>1?Math.max(8,CDR-1):Math.max(10,CDR+1)}px sans-serif`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(lbl,cx,cy+.5);
      });
    }
  }

  // ── Interval overlays (triads, thirds, sixths) ──────────────────────────
  const anyInterval = Object.values(intervalVis).some(v=>v);
  if(anyInterval){
    const IDR = Math.max(Math.floor(DR*0.72), 6);

    function inShapeRegion(vf){
      // Intervals show across full neck regardless of CAGED shape toggle status
      return vf >= 0 && vf <= SHOW;
    }

    const SCALE_INT = isMajor ? [0,2,4,5,7,9,11] : [0,2,3,5,7,8,10];
    const CHORD_TONES = isMajor ? [0,4,7] : [0,3,7];

    const STRING_GROUPS = {
      triads123:[5,4,3], triads234:[4,3,2],
      triads345:[3,2,1], triads456:[2,1,0]
    };

    function drawDot(cx,cy,r,color,label){
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle=color+'dd';ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.stroke();
      if(label){
        ctx.fillStyle='white';
        ctx.font=`bold ${Math.max(r-2,6)}px sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(label,cx,cy+0.5);
      }
    }

    function intLabel(i){ return i===0?'R':(i===4||i===3)?'3':'5'; }

    function drawLine(pts,color){
      ctx.strokeStyle=color+'55';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(pts[0].cx,pts[0].cy);
      pts.slice(1).forEach(p=>ctx.lineTo(p.cx,p.cy));
      ctx.stroke();
    }

    // Hardcoded triad shapes as fret offsets from root position on anchor string.
    // Offsets derived from C major positions, valid for all keys.
    // Each shape: [offset_s1, offset_s2, offset_s3] from root-fret on s1.
    // We tile each shape at offset, offset+12 to cover full neck.
    // Helper: draw line between two points, trimmed by radius at each end
    // so lines connect circle edges instead of covering the notes
    function lineBetween(x1,y1,x2,y2,r){
      const dx=x2-x1, dy=y2-y1;
      const len=Math.hypot(dx,dy);
      if(len<1) return;
      const ux=dx/len, uy=dy/len;
      ctx.beginPath();
      ctx.moveTo(x1+ux*r, y1+uy*r);
      ctx.lineTo(x2-ux*r, y2-uy*r);
      ctx.stroke();
    }

    // Triad shapes: separate major and minor sets (minor = flat 3rd).
    // Offsets from root-fret on anchor string. Anchored to R (actual root).
    const TRIAD_SHAPES_MAJ = {
      triads123: { anchor:5, shapes:[[-8,-7,-8],[-5,-3,-3],[0,0,1],[4,5,4]] },
      triads234: { anchor:4, shapes:[[0,-1,1],[4,4,4],[7,8,9],[12,11,13]] },
      triads345: { anchor:3, shapes:[[-5,-3,-2],[0,0,2],[4,5,5]] },
      triads456: { anchor:2, shapes:[[-8,-7,-7],[-5,-3,-2],[0,0,2]] },
    };
    const TRIAD_SHAPES_MIN = {
      triads123: { anchor:5, shapes:[[-5,-4,-3],[0,0,0],[3,5,4]] },
      triads234: { anchor:4, shapes:[[0,-1,0],[3,4,4],[7,7,9],[12,11,12]] },
      triads345: { anchor:3, shapes:[[-5,-4,-2],[0,0,1],[3,5,5]] },
      triads456: { anchor:2, shapes:[[-9,-7,-7],[-5,-4,-2],[0,0,1]] },
    };
    const TRIAD_SHAPES = isMajor ? TRIAD_SHAPES_MAJ : TRIAD_SHAPES_MIN;

    ['triads123','triads234','triads345','triads456'].forEach(key=>{
      if(!intervalVis[key]) return;
      const color=INTERVAL_COLORS[key];
      const {anchor, shapes}=TRIAD_SHAPES[key];
      const [s1,s2,s3]=STRING_GROUPS[key];
      // Anchor to actual root R (not shapeShift) so triad quality is correct
      const anchorFret=(effectiveR-SOPEN[anchor]+120)%12;

      shapes.forEach(([o1,o2,o3])=>{
        [-12,0,12,24].forEach(oct=>{
          const af1=anchorFret+o1+oct;
          const af2=anchorFret+o2+oct;
          const af3=anchorFret+o3+oct;
          if([af1,af2,af3].some(f=>f<0||f>SHOW)) return;
          const x1=dotX(af1),y1=dotY(strRow(s1));
          const x2=dotX(af2),y2=dotY(strRow(s2));
          const x3=dotX(af3),y3=dotY(strRow(s3));
          ctx.strokeStyle=color+'cc';
          ctx.lineWidth=4;
          ctx.lineJoin='round';
          ctx.lineCap='round';
          lineBetween(x1,y1,x2,y2,DR+1);
          lineBetween(x2,y2,x3,y3,DR+1);
          // Color the note borders to match this layer
          ctx.lineWidth=3;
          [[x1,y1],[x2,y2],[x3,y3]].forEach(([px,py])=>{
            ctx.strokeStyle=color;
            ctx.beginPath(); ctx.arc(px,py,DR+1,0,Math.PI*2); ctx.stroke();
          });
        });
      });
    });

    // Thirds and Sixths - hardcoded shapes (root on lower string, interval note on higher string)
    const THIRDS_SHAPES = {
      's5_4':{anchor:4,sLow:4,sHigh:5,offsets:[[0,-1],[2,0],[4,2],[5,4],[7,6],[9,7],[11,9]]},
      's4_3':{anchor:3,sLow:3,sHigh:4,offsets:[[-5,-5],[-3,-4],[-1,-2],[0,0],[2,1],[4,3],[5,5]]},
      's3_2':{anchor:2,sLow:2,sHigh:3,offsets:[[-8,-10],[-7,-8],[-5,-6],[-3,-5],[-1,-3],[0,-1],[2,0]]},
      's2_1':{anchor:1,sLow:1,sHigh:2,offsets:[[-1,-3],[0,-1],[2,0],[4,2],[5,4],[7,6],[9,7]]},
      's1_0':{anchor:0,sLow:0,sHigh:1,offsets:[[-7,-8],[-5,-6],[-3,-5],[-1,-3],[0,-1],[2,0],[4,2]]},
    };
    const SIXTHS_SHAPES = {
      's5_3':{anchor:3,sLow:3,sHigh:5,offsets:[[-5,-5],[-3,-4],[-1,-2],[0,0],[2,2],[4,3],[5,5]]},
      's4_2':{anchor:2,sLow:2,sHigh:4,offsets:[[-10,-10],[-8,-9],[-7,-7],[-5,-5],[-3,-4],[-1,-2],[0,0]]},
      's3_1':{anchor:1,sLow:1,sHigh:3,offsets:[[-1,-3],[0,-1],[2,1],[4,2],[5,4],[7,6],[9,7]]},
      's2_0':{anchor:0,sLow:0,sHigh:2,offsets:[[-7,-8],[-5,-6],[-3,-5],[-1,-3],[0,-1],[2,1],[4,2]]},
    };

    const SHAPES_MAP = {
      thirds_5_4:THIRDS_SHAPES['s5_4'], thirds_4_3:THIRDS_SHAPES['s4_3'],
      thirds_3_2:THIRDS_SHAPES['s3_2'], thirds_2_1:THIRDS_SHAPES['s2_1'],
      thirds_1_0:THIRDS_SHAPES['s1_0'],
      sixths_5_3:SIXTHS_SHAPES['s5_3'], sixths_4_2:SIXTHS_SHAPES['s4_2'],
      sixths_3_1:SIXTHS_SHAPES['s3_1'], sixths_2_0:SIXTHS_SHAPES['s2_0'],
    };

    Object.keys(SHAPES_MAP).forEach(key=>{
      if(!intervalVis[key]) return;
      const color=INTERVAL_COLORS[key];
      const {anchor,sLow,sHigh,offsets}=SHAPES_MAP[key];
      const anchorFret=(shapeShift-SOPEN[anchor]+120)%12;
      offsets.forEach(([oLow,oHigh])=>{
        [-12,0,12,24].forEach(oct=>{
          const vfLow=anchorFret+oLow+oct;
          const vfHigh=anchorFret+oHigh+oct;
          if(vfLow<0||vfLow>SHOW||vfHigh<0||vfHigh>SHOW) return;
          ctx.strokeStyle=color+'cc';ctx.lineWidth=3;ctx.lineCap='round';
          const lx1=dotX(vfLow),ly1=dotY(strRow(sLow));
          const lx2=dotX(vfHigh),ly2=dotY(strRow(sHigh));
          lineBetween(lx1,ly1,lx2,ly2,DR+1);
          ctx.lineWidth=3;
          [[lx1,ly1],[lx2,ly2]].forEach(([px,py])=>{
            ctx.strokeStyle=color;
            ctx.beginPath(); ctx.arc(px,py,DR+1,0,Math.PI*2); ctx.stroke();
          });
        });
      });
    });
  }

  buildCapoChart(effectiveR, isMajor, capo, useFlats);
}

// Keep the chord selector's quality in sync with the key's mode when the
// selected chord is the tonic, so the overlay matches the CAGED notes.
function syncChordToKey(){
  const keyVal = document.getElementById('ks').value;      // major key value e.g. 'F'
  const majIdx = ni(EN[keyVal]||keyVal);
  // In minor mode the tonic is the RELATIVE minor (3 semitones below)
  const keyIdx = isMajor ? majIdx : (majIdx-3+12)%12;
  const cr = document.getElementById('cr');
  const ct = document.getElementById('ct');
  if(!cr || !ct) return;
  const chordIdx = ni(cr.value);
  // Only auto-adjust if the chord root IS the key root (the tonic chord)
  if(chordIdx !== keyIdx) return;
  const t = ct.value;
  if(isMajor && t === 'm') ct.value = 'maj';
  else if(!isMajor && t === 'maj') ct.value = 'm';
  updateVoicingDropdown();
}

function updateVoicingDropdown(){
  const root=document.getElementById('cr').value;

  sel.innerHTML='';
  if(voicings && voicings.length>1){
    voicings.forEach((v,i)=>{
      const opt=document.createElement('option');
      opt.value=i;
      opt.textContent=v.l||(i===0?'1st':i===1?'2nd':i===2?'3rd':(i+1)+'th');

    sel.style.color=voicings?'#eee':'#555';
    sel.style.opacity=voicings?'1':'0.5';
  }
}

function getAvailableSlashBassNotes(root, acc){
  // root is now full note name (C, C#, D#, G#, A# etc)
  let note = root; // acc is unused
  const norm = {'A#':'Bb','C#':'Db','D#':'Eb','G#':'Ab'};
  if(norm[note]) note=norm[note];
  // Find all CHORDS keys that start with this note and have '/'
  const available=new Set();
  Object.keys(CHORD_VOICINGS).forEach(k=>{
    if(!k.includes('/')) return;
    const parts=k.split('/');
    const chordRoot=parts[0]; // e.g. 'Gmaj' or 'Am'
    // Strip chord type suffix to get the root note
    const chordNote=chordRoot.replace(/(maj7|maj9|maj|m7|m6|m9|m|7|6|9|sus4|sus2|sus|add9|dim|\+|5)/g,'');
    if(chordNote===note){
      available.add('/'+parts[1]);
    }
  });
  return available;
}

function updateSlashOptions(){
  const root=document.getElementById('cr').value;
  const available=getAvailableSlashBassNotes(root,'');
  const ct=document.getElementById('ct');
  const curVal=ct.value;

  // Remove existing slash optgroup and rebuild with only available options
  const existingGroup=ct.querySelector('optgroup');
  if(existingGroup) existingGroup.remove();

  if(available.size>0){
    const grp=document.createElement('optgroup');
    grp.label='── Slash chords ──';
    // Musical order
    const order=['A','Bb','B','C','C#','D','D#','Eb','E','F','F#','G','Ab','G#'];
    const dispMap={'C#':'C♯','D#':'D♯','F#':'F♯','G#':'G♯','Ab':'A♭','Bb':'B♭','Eb':'E♭'};
    order.forEach(note=>{
      const val='/'+note;
      if(!available.has(val)) return;
      const opt=document.createElement('option');
      opt.value=val;
      opt.textContent='/ '+(dispMap[note]||note)+' bass';
      grp.appendChild(opt);
    });
    ct.appendChild(grp);
  }

  // Restore selection if still valid, else reset to maj
  if(curVal.startsWith('/') && !available.has(curVal)){
    ct.value='maj';
  } else {
    ct.value=curVal;
  }
}

// ── Chord picker sheet: one button + three scroll wheels (root/type/voicing)
// instead of three separate dropdowns. The wheels just drive the hidden
// cr/ct/voicing selects above via real 'change' events, so all the existing
// chord logic (slash options, voicing rebuild, chord display) is untouched.
const WHEEL_ITEM_H = 34;
let pendingRoot = null, pendingType = null, pendingVoicing = 0;

function buildWheel(trackId, options, selectedValue){
  const track=document.getElementById(trackId);
  track.innerHTML='';
  options.forEach(opt=>{
    const div=document.createElement('div');
    div.className='wheel-item'+(opt.value===selectedValue?' selected':'');
    div.textContent=opt.label;
    div.dataset.value=opt.value;
    track.appendChild(div);
  });
  const idx=Math.max(0, options.findIndex(o=>o.value===selectedValue));
  track.parentElement.scrollTop=idx*WHEEL_ITEM_H;
}

function rebuildTypeWheel(rootValue, keepType){
  const available=getAvailableSlashBassNotes(rootValue,'');
  const order=['A','Bb','B','C','C#','D','D#','Eb','E','F','F#','G','Ab','G#'];
  const dispMap={'C#':'C♯','D#':'D♯','F#':'F♯','G#':'G♯','Ab':'A♭','Bb':'B♭','Eb':'E♭'};
  const base=[
    {value:'maj',label:'Major'},{value:'m',label:'Minor'},{value:'7',label:'7'},
    {value:'m7',label:'m7'},{value:'maj7',label:'maj7'},{value:'6',label:'6'},
    {value:'m6',label:'m6'},{value:'9',label:'9'},{value:'sus4',label:'sus4'},
    {value:'sus2',label:'sus2'},{value:'add9',label:'add9'},{value:'7sus4',label:'7sus4'},
    {value:'5',label:'5 (power)'},{value:'maj9',label:'maj9'},{value:'m9',label:'m9'},
    {value:'dim',label:'dim'},{value:'+',label:'aug (+)'},
  ];
  const slash=order.filter(n=>available.has('/'+n)).map(n=>({value:'/'+n,label:'/ '+(dispMap[n]||n)+' bass'}));
  const options=base.concat(slash);
  pendingType = options.some(o=>o.value===keepType) ? keepType : 'maj';
  buildWheel('wheelTypeTrack', options, pendingType);
}

function rebuildVoicingWheel(rootValue, typeValue, keepVoicing){
  const voicings=CHORD_VOICINGS[chordKey(rootValue,'',typeValue)];
  const options = (voicings && voicings.length>1)
    ? voicings.map((v,i)=>({value:String(i), label:v.l||(i===0?'1st':i===1?'2nd':i===2?'3rd':(i+1)+'th')}))
    : [{value:'0', label:voicings?'Only':'—'}];
  pendingVoicing = options.some(o=>o.value===String(keepVoicing)) ? +keepVoicing : 0;
  buildWheel('wheelVoicingTrack', options, String(pendingVoicing));
}

function onWheelSettle(wheelId){
  const wheel=document.getElementById(wheelId);
  const items=[...wheel.querySelectorAll('.wheel-item')];
  if(!items.length) return;
  const idx=Math.min(items.length-1, Math.max(0, Math.round(wheel.scrollTop/WHEEL_ITEM_H)));
  const snapTop=idx*WHEEL_ITEM_H;
  if(Math.abs(wheel.scrollTop-snapTop)>1) wheel.scrollTop=snapTop;
  items.forEach((el,i)=>el.classList.toggle('selected', i===idx));
  const value=items[idx].dataset.value;
  if(wheelId==='wheelRoot'){
    pendingRoot=value;
    rebuildTypeWheel(pendingRoot, pendingType);
    rebuildVoicingWheel(pendingRoot, pendingType, pendingVoicing);
  } else if(wheelId==='wheelType'){
    pendingType=value;
    rebuildVoicingWheel(pendingRoot, pendingType, pendingVoicing);
  } else {
    pendingVoicing=+value;
  }
}

function setupWheelDrag(wheelId){
  const wheel=document.getElementById(wheelId);
  let dragging=false, startY=0, startTop=0, moved=false;
  wheel.addEventListener('pointerdown',e=>{
    dragging=true; moved=false; startY=e.clientY; startTop=wheel.scrollTop;
    wheel.setPointerCapture(e.pointerId);
  });
  wheel.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const dy=e.clientY-startY;
    if(Math.abs(dy)>3) moved=true;
    wheel.scrollTop=startTop-dy;
  });
  wheel.addEventListener('pointerup',e=>{
    dragging=false;
    if(moved) return;
    const item=e.target.closest('.wheel-item');
    if(item) wheel.scrollTop=[...wheel.querySelectorAll('.wheel-item')].indexOf(item)*WHEEL_ITEM_H;
  });
  wheel.addEventListener('scroll',()=>{
    clearTimeout(wheel._settleTimer);
    wheel._settleTimer=setTimeout(()=>onWheelSettle(wheelId), 130);
  });
}
['wheelRoot','wheelType','wheelVoicing'].forEach(setupWheelDrag);

function openChordPicker(){
  const cr=document.getElementById('cr'), ct=document.getElementById('ct'), voicing=document.getElementById('voicing');
  pendingRoot=cr.value; pendingType=ct.value; pendingVoicing=+voicing.value||0;
  buildWheel('wheelRootTrack', [...cr.options].map(o=>({value:o.value,label:o.textContent})), pendingRoot);
  rebuildTypeWheel(pendingRoot, pendingType);
  rebuildVoicingWheel(pendingRoot, pendingType, pendingVoicing);
  document.getElementById('chordPickerOverlay').classList.add('open');
}

function closeChordPicker(){
  document.getElementById('chordPickerOverlay').classList.remove('open');
}

function applyChordPicker(){
  ['wheelRoot','wheelType','wheelVoicing'].forEach(id=>{
    clearTimeout(document.getElementById(id)._settleTimer);
    onWheelSettle(id);
  });
  const cr=document.getElementById('cr'), ct=document.getElementById('ct'), voicing=document.getElementById('voicing');
  cr.value=pendingRoot; cr.dispatchEvent(new Event('change'));
  ct.value=pendingType; ct.dispatchEvent(new Event('change'));
  voicing.value=String(pendingVoicing); voicing.dispatchEvent(new Event('change'));
  closeChordPicker();
}

window.addEventListener('resize',draw);
// ── Capo drag interaction ──
(function setupCapoDrag(){
  const cv=document.getElementById('cv');

  function fretFromX(clientX){
    const geo=window._fbGeo; if(!geo) return 0;
    const rect=cv.getBoundingClientRect();
    const scaleX=cv.width/rect.width;
    const x=(clientX-rect.left)*scaleX;
    // fret space: dotX center = lW+(vf-0.5)*fw. Solve for vf.
    let vf=Math.round((x-geo.lW)/geo.fw + 0.5);
    if(vf<0) vf=0;
    if(vf>geo.SHOW) vf=geo.SHOW;
    return vf;
  }

  function nearCapo(clientX){
    const geo=window._fbGeo; if(!geo) return false;
    const rect=cv.getBoundingClientRect();
    const scaleX=cv.width/rect.width;
    const x=(clientX-rect.left)*scaleX;
    // Capo bar x (or nut if capo=0)
    const capoX = capoPos>0 ? geo.lW+(capoPos-0.5)*geo.fw : geo.lW;
    return Math.abs(x-capoX) < geo.fw*0.7; // within ~0.7 fret of the bar
  }

  function setCapo(vf){
    capoPos=vf;
    const sel=document.getElementById('cap');
    if(sel){
      // Only set if option exists, else add temporarily
      if([...sel.options].some(o=>+o.value===vf)) sel.value=vf;
    }
    draw();
  }

  function onDown(e){
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    if(nearCapo(cx)){
      draggingCapo=true;
      cv.style.cursor='grabbing';
      e.preventDefault();
    }
  }
  function onMove(e){
    if(!draggingCapo){
      // hover cursor hint
      const cx=e.touches?e.touches[0].clientX:e.clientX;
      cv.style.cursor=nearCapo(cx)?'grab':'default';
      return;
    }
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    setCapo(fretFromX(cx));
    e.preventDefault();
  }
  function onUp(){
    if(draggingCapo){ draggingCapo=false; cv.style.cursor='default'; }
  }

  cv.addEventListener('mousedown',onDown);
  cv.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
  cv.addEventListener('touchstart',onDown,{passive:false});
  cv.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('touchend',onUp);
})();
